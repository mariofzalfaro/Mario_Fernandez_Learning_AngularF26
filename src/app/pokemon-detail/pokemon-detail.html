<h2>Details of the Pokemon</h2>
@if (pokemon(); as pokemon) {
  <h2 appHighlight="#f0e446">{{pokemon.name | uppercase }}</h2>
    <p>Pokedex Number: {{ pokemon.id }}</p>
  <button type="button" (click)="savedService.toggle(pokemon.id)">
    {{ savedService.isSaved(pokemon.id) ? 'Unsave' : 'Save' }}
  </button>
}
@else {
 <p>No pokemon on the list</p>
}
